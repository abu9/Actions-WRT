name: Build and Push prebuilt tools container
run-name: Build and Push prebuilt tools container - ${{ inputs.source_branch }}/${{ inputs.config_name }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: false
        default: 'immortalwrt/immortalwrt@openwrt-25.12'
        type: choice
        options:
          - openwrt/openwrt@main
          - coolsnowwolf/lede@master
          - immortalwrt/immortalwrt@openwrt-23.05
          - immortalwrt/immortalwrt@openwrt-24.10
          - immortalwrt/immortalwrt@openwrt-25.12
          - immortalwrt/immortalwrt@v25.12.2
      source_commit:
        description: 'Optional exact upstream source commit; empty resolves the selected branch once'
        required: false
        default: ''
        type: string
      config_name:
        description: 'Config file name'
        type: choice
        options:
          - '.config7981'
          - '.config7981.mtwifi-cfg'
          - '360t7-immortalwrt.conf'
          - '360t7-immortalwrt-uhttpd.conf'
          - '360t7-immortalwrt-24.10.conf'
          - '360t7-immortalwrt-25.12-ubi.conf'
        default: '360t7-immortalwrt-25.12-ubi.conf'
      build_tools:
        description: 'Build and push the generic host-tools container'
        type: boolean
        default: true
      build_toolchain:
        description: 'Also build and push a target-specific toolchain container'
        type: boolean
        default: false
  workflow_call:
    outputs:
      tools_fingerprint:
        description: 'Resolved generic Host Tools fingerprint'
        value: ${{ jobs.compute-tools-fingerprint.outputs.tools_fingerprint }}
      toolchain_fingerprint:
        description: 'Resolved target Toolchain fingerprint'
        value: ${{ jobs.compute-toolchain-fingerprint.outputs.toolchain_fingerprint }}
      source_commit:
        description: 'Exact upstream source commit resolved for this test run'
        value: ${{ jobs.compute-tools-fingerprint.outputs.source_commit || jobs.determine_container_info.outputs.source_commit || jobs.determine_targets.outputs.source_commit }}
    inputs:
      source_branch:
        required: true
        type: string
      config_name:
        required: true
        type: string
      build_tools:
        type: boolean
        default: true
      build_toolchain:
        type: boolean
        default: false
      source_commit:
        type: string
        default: ''
      target:
        type: string
        default: ''
      subtarget:
        type: string
        default: ''
      repo_url:
        type: string
        default: ''
      repo_branch:
        type: string
        default: ''
      author:
        type: string
        default: ''
      tools_fingerprint:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_branch }}
  cancel-in-progress: true

jobs:
  determine_targets:
    name: Get target info
    if: ${{ inputs.target == '' }}
    uses: ./.github/workflows/determine-targets.yml
    with:
      config_name: ${{ inputs.config_name }}
      source_branch: ${{ inputs.source_branch }}
      source_commit: ${{ inputs.source_commit }}

  determine_container_info:
    name: Determine tools image tag
    if: ${{ !cancelled() && (needs.determine_targets.result == 'success' || inputs.target != '') }}
    needs: determine_targets
    runs-on: ubuntu-24.04
    outputs:
      owner_lc: ${{ steps.info.outputs.owner_lc }}
      container_tag: ${{ steps.info.outputs.container_tag }}
      source_commit: ${{ steps.info.outputs.source_commit }}
    steps:
      - name: Determine owner and tag
        id: info
        env:
          AUTHOR: ${{ inputs.author || needs.determine_targets.outputs.author }}
          REPO_BRANCH: ${{ inputs.repo_branch || needs.determine_targets.outputs.repo_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit || needs.determine_targets.outputs.source_commit }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -eo pipefail
          OWNER_LC="${OWNER,,}"
          # This is the branch-scoped base tag. The published generic tools
          # image appends the computed content fingerprint to this value.
          CONTAINER_TAG="${AUTHOR}_${REPO_BRANCH}"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "container_tag=$CONTAINER_TAG" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Will publish ghcr.io/$OWNER_LC/tools:$CONTAINER_TAG"

  compute-tools-fingerprint:
    permissions:
      contents: read
      packages: read
    name: Compute generic host-tools fingerprint
    if: ${{ !cancelled() && (needs.determine_targets.result == 'success' || inputs.target != '') && inputs.build_tools == true && inputs.tools_fingerprint == '' }}
    needs: determine_targets
    uses: ./.github/workflows/fingerprint.yml
    with:
      mode: tools
      repo_url: ${{ inputs.repo_url || needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ inputs.repo_branch || needs.determine_targets.outputs.repo_branch }}
      source_commit: ${{ inputs.source_commit || needs.determine_targets.outputs.source_commit }}

  build-linux-buildbot:
    name: Build host tools with upstream buildbot
    if: ${{ !cancelled() &&
        (needs.determine_targets.result == 'success' || inputs.target != '') &&
        needs.determine_container_info.result == 'success' &&
        (needs.compute-tools-fingerprint.result == 'success' || inputs.tools_fingerprint != '') &&
        inputs.build_tools == true }}
    needs: [determine_targets, determine_container_info, compute-tools-fingerprint]
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable_build_tools.yml
    with:
      generate_prebuilt_artifacts: true
      repo_url: ${{ inputs.repo_url || needs.determine_targets.outputs.repo_url }}
      source_commit: ${{ inputs.source_commit || needs.compute-tools-fingerprint.outputs.source_commit }}
      ccache_tag: ${{ needs.determine_container_info.outputs.container_tag }}

  push-tools-container:
    name: Push generic host-tools image
    if: ${{ !cancelled() &&
        (needs.determine_targets.result == 'success' || inputs.target != '') &&
        needs.determine_container_info.result == 'success' &&
        needs.build-linux-buildbot.result == 'success' &&
        (needs.compute-tools-fingerprint.result == 'success' || inputs.tools_fingerprint != '') &&
        inputs.build_tools == true }}
    needs: [determine_targets, determine_container_info, build-linux-buildbot, compute-tools-fingerprint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Actions-WRT repository
        uses: actions/checkout@v7.0.1

      - name: Download prebuilt tools
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-buildbot-prebuilt-tools

      - name: Extract prebuilt tools
        run: tar -xf tools.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ needs.determine_container_info.outputs.owner_lc }}/tools:${{ needs.determine_container_info.outputs.container_tag }}-${{ inputs.tools_fingerprint || needs.compute-tools-fingerprint.outputs.tools_fingerprint }}
          labels: |
            io.abu9.actions-wrt.tools-fingerprint=${{ inputs.tools_fingerprint || needs.compute-tools-fingerprint.outputs.tools_fingerprint }}
            io.abu9.actions-wrt.tools-source-commit=${{ inputs.source_commit || needs.compute-tools-fingerprint.outputs.source_commit }}
            io.abu9.actions-wrt.tools-source-repository=${{ inputs.repo_url || needs.determine_targets.outputs.repo_url }}
          file: .github/dockerfiles/Dockerfile.tools

      - name: Verify published Host Tools image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_LC: ${{ needs.determine_container_info.outputs.owner_lc }}
          IMAGE_TAG: ${{ needs.determine_container_info.outputs.container_tag }}-${{ inputs.tools_fingerprint || needs.compute-tools-fingerprint.outputs.tools_fingerprint }}
        shell: bash
        run: |
          set -e
          GHCR_TOKEN="$(printf '%s' "$GITHUB_TOKEN" | base64 -w0)"
          GHCR_HEADER="Authorization: Bearer $GHCR_TOKEN"
          GHCR_MANIFEST_LINK="https://ghcr.io/v2/$OWNER_LC/tools/manifests/$IMAGE_TAG"
          for attempt in 1 2 3 4 5; do
            HTTP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -H "$GHCR_HEADER" -I "$GHCR_MANIFEST_LINK")"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Published Host Tools image verified: HTTP 200"
              exit 0
            fi
            echo "Host Tools image not yet available: HTTP $HTTP_STATUS (attempt $attempt/5)" >&2
            sleep 3
          done
          echo "Published Host Tools image verification failed: HTTP $HTTP_STATUS" >&2
          exit 1

  compute-toolchain-fingerprint:
    permissions:
      contents: read
      packages: read
    name: Compute target Toolchain fingerprint
    if: ${{ !cancelled() && (needs.determine_targets.result == 'success' || inputs.target != '') && needs.build-linux-buildbot.result == 'success' && inputs.build_toolchain == true && inputs.build_tools == true }}
    needs: [determine_targets, determine_container_info, compute-tools-fingerprint, build-linux-buildbot]
    uses: ./.github/workflows/fingerprint.yml
    with:
      mode: toolchain
      repo_url: ${{ inputs.repo_url || needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ inputs.repo_branch || needs.determine_targets.outputs.repo_branch }}
      source_commit: ${{ inputs.source_commit || needs.compute-tools-fingerprint.outputs.source_commit }}
      target: ${{ inputs.target || needs.determine_targets.outputs.target }}
      subtarget: ${{ inputs.subtarget || needs.determine_targets.outputs.subtarget }}
      tools_fingerprint: ${{ inputs.tools_fingerprint || needs.compute-tools-fingerprint.outputs.tools_fingerprint }}
      tools_image: ''
      use_prebuilt_tools_artifact: true
      use_ccache_cache: true

  build-target-toolchain:
    name: Build target-specific toolchain
    if: ${{ !cancelled() &&
        (needs.determine_targets.result == 'success' || inputs.target != '') &&
        (needs.compute-tools-fingerprint.result == 'success' || inputs.tools_fingerprint != '') &&
        needs.build-linux-buildbot.result == 'success' &&
        needs.compute-toolchain-fingerprint.result == 'success' &&
        inputs.build_toolchain == true &&
        inputs.build_tools == true }}
    needs: [determine_targets, compute-tools-fingerprint, build-linux-buildbot, compute-toolchain-fingerprint]
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable_build.yml
    with:
      target: ${{ inputs.target || needs.determine_targets.outputs.target }}
      subtarget: ${{ inputs.subtarget || needs.determine_targets.outputs.subtarget }}
      repo_url: ${{ inputs.repo_url || needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ inputs.repo_branch || needs.determine_targets.outputs.repo_branch }}
      repo_commit: ${{ inputs.source_commit || needs.compute-tools-fingerprint.outputs.source_commit }}
      tools_fingerprint: ${{ inputs.tools_fingerprint || needs.compute-tools-fingerprint.outputs.tools_fingerprint }}
      toolchain_fingerprint: ${{ needs.compute-toolchain-fingerprint.outputs.toolchain_fingerprint }}
      author: ${{ inputs.author || needs.determine_targets.outputs.author }}
      config_name: ${{ inputs.config_name }}
      container_name: tools
      build_toolchain: true
      use_prebuilt_tools_artifact: true
      check: false
      use_ccache_cache: true
      ccache_type: toolchain
      build_external_toolchain: true
      upload_external_toolchain: true

  push-target-toolchain:
    name: Push target-specific toolchain image
    if: >-
      ${{ !cancelled() &&
          (needs.determine_targets.result == 'success' || inputs.target != '') &&
          needs.determine_container_info.result == 'success' &&
          (needs.compute-tools-fingerprint.result == 'success' || inputs.tools_fingerprint != '') &&
          needs.compute-toolchain-fingerprint.result == 'success' &&
          needs.build-target-toolchain.result == 'success' &&
          needs.build-target-toolchain.outputs.push == 'true' }}
    needs: [determine_targets, determine_container_info, compute-tools-fingerprint, compute-toolchain-fingerprint, build-linux-buildbot, build-target-toolchain]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Actions-WRT repository
        uses: actions/checkout@v7.0.1

      - name: Download prebuilt Host Tools artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-buildbot-prebuilt-tools

      - name: Extract prebuilt Host Tools
        run: tar -xf tools.tar

      - name: Download external toolchain artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.target || needs.determine_targets.outputs.target }}-${{ inputs.subtarget || needs.determine_targets.outputs.subtarget }}-external-toolchain

      - name: Determine toolchain archive name
        id: get-toolchain-name
        shell: bash
        run: |
          set -eo pipefail
          TOOLCHAIN_NAME="$(find . -maxdepth 1 -type f -name '*toolchain*' -printf '%f\n' | head -n1)"
          test -n "$TOOLCHAIN_NAME"
          echo "toolchain_name=$TOOLCHAIN_NAME" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push target toolchain image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ needs.determine_container_info.outputs.owner_lc }}/toolchain:${{ inputs.target || needs.determine_targets.outputs.target }}-${{ inputs.subtarget || needs.determine_targets.outputs.subtarget }}-${{ needs.determine_container_info.outputs.container_tag }}-${{ needs.compute-toolchain-fingerprint.outputs.toolchain_cache_key }}
          file: .github/dockerfiles/Dockerfile.toolchain
          build-args: |
            TOOLS_FINGERPRINT=${{ inputs.tools_fingerprint || needs.compute-tools-fingerprint.outputs.tools_fingerprint }}
            SOURCE_COMMIT=${{ inputs.source_commit || needs.compute-tools-fingerprint.outputs.source_commit }}
            TOOLCHAIN_NAME=${{ steps.get-toolchain-name.outputs.toolchain_name }}
            TOOLCHAIN_FINGERPRINT=${{ needs.compute-toolchain-fingerprint.outputs.toolchain_fingerprint }}

      - name: Verify published target Toolchain image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_LC: ${{ needs.determine_container_info.outputs.owner_lc }}
          IMAGE_TAG: ${{ inputs.target || needs.determine_targets.outputs.target }}-${{ inputs.subtarget || needs.determine_targets.outputs.subtarget }}-${{ needs.determine_container_info.outputs.container_tag }}-${{ needs.compute-toolchain-fingerprint.outputs.toolchain_cache_key }}
        shell: bash
        run: |
          set -e
          GHCR_TOKEN="$(printf '%s' "$GITHUB_TOKEN" | base64 -w0)"
          GHCR_HEADER="Authorization: Bearer $GHCR_TOKEN"
          GHCR_MANIFEST_LINK="https://ghcr.io/v2/$OWNER_LC/toolchain/manifests/$IMAGE_TAG"
          for attempt in 1 2 3 4 5; do
            HTTP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -H "$GHCR_HEADER" -I "$GHCR_MANIFEST_LINK")"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Published target Toolchain image verified: HTTP 200"
              exit 0
            fi
            echo "Target Toolchain image not yet available: HTTP $HTTP_STATUS (attempt $attempt/5)" >&2
            sleep 3
          done
          echo "Published target Toolchain image verification failed: HTTP $HTTP_STATUS" >&2
          exit 1
