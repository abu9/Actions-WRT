name: Compute target Toolchain content fingerprint
on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      target:
        required: true
        type: string
      subtarget:
        required: true
        type: string
      tools_fingerprint:
        required: true
        type: string
      tools_image:
        required: true
        type: string
    outputs:
      toolchain_fingerprint:
        value: ${{ jobs.fingerprint.outputs.toolchain_fingerprint }}
      toolchain_cache_key:
        value: ${{ jobs.fingerprint.outputs.toolchain_cache_key }}
      source_commit:
        value: ${{ jobs.fingerprint.outputs.source_commit }}

permissions:
  contents: read
  packages: read

jobs:
  fingerprint:
    name: Resolve actual Toolchain config and fingerprint its inputs
    runs-on: ubuntu-24.04
    container: ${{ inputs.tools_image }}
    permissions:
      contents: read
      packages: read
    outputs:
      toolchain_fingerprint: ${{ steps.fingerprint.outputs.toolchain_fingerprint }}
      toolchain_cache_key: ${{ steps.fingerprint.outputs.toolchain_cache_key }}
      source_commit: ${{ steps.fingerprint.outputs.source_commit }}
    steps:
      - name: Checkout Actions-WRT fingerprint implementation
        uses: actions/checkout@v7.0.1
        with:
          path: actions-wrt

      - name: Checkout exact OpenWrt source commit
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repo_url }}
          ref: ${{ inputs.source_commit }}
          path: openwrt

      - name: Verify source commit and attach prebuilt Host Tools
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C openwrt rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_COMMIT" ]]; then
            echo "Source commit mismatch: expected $EXPECTED_SOURCE_COMMIT, got $actual." >&2
            exit 1
          fi
          chown -R buildbot:buildbot actions-wrt openwrt
          cd openwrt
          mkdir -p staging_dir build_dir
          ln -s /prebuilt_tools/staging_dir/host staging_dir/host
          ln -s /prebuilt_tools/build_dir/host build_dir/host

      - name: Generate the same internal Toolchain defconfig as the build
        working-directory: openwrt
        env:
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
        shell: bash
        run: |
          set -euo pipefail
          su --preserve-environment --shell /bin/bash buildbot -c 'sh -e' <<'TOOLCHAIN_CONFIG'
          rm -f .config
          echo CONFIG_CCACHE=y >> .config
          echo CONFIG_DEVEL=y >> .config
          echo CONFIG_AUTOREMOVE=y >> .config
          echo "CONFIG_TARGET_${TARGET}=y" >> .config
          echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y" >> .config
          make defconfig
          TOOLCHAIN_CONFIG

      - name: Compute Toolchain content fingerprint
        id: fingerprint
        env:
          SOURCE_REPO: ${{ inputs.repo_url }}
          SOURCE_REF: ${{ inputs.repo_branch }}
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
          TOOLS_FINGERPRINT: ${{ inputs.tools_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          python3 actions-wrt/.github/scripts/toolchain-fingerprint.py \
            --source-dir openwrt \
            --local-repo-dir actions-wrt \
            --source-repo "$SOURCE_REPO" \
            --source-ref "$SOURCE_REF" \
            --target "$TARGET" \
            --subtarget "$SUBTARGET" \
            --tools-fingerprint "$TOOLS_FINGERPRINT"
