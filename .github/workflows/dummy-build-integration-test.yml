name: Dummy build integration test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: dummy-build-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine_target:
    name: Resolve pinned 360T7 build inputs
    uses: ./.github/workflows/determine-targets.yml
    with:
      source_branch: immortalwrt/immortalwrt@openwrt-25.12
      config_name: 360t7-immortalwrt-25.12-ubi.conf

  dummy_containers:
    name: Build and publish fixture Host Tools / Toolchain images
    needs: determine_target
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/push-containers.yml
    with:
      source_branch: immortalwrt/immortalwrt@openwrt-25.12
      config_name: 360t7-immortalwrt-25.12-ubi.conf
      source_commit: ${{ needs.determine_target.outputs.source_commit }}
      target: ${{ needs.determine_target.outputs.target }}
      subtarget: ${{ needs.determine_target.outputs.subtarget }}
      repo_url: ${{ needs.determine_target.outputs.repo_url }}
      repo_branch: ${{ needs.determine_target.outputs.repo_branch }}
      author: ${{ needs.determine_target.outputs.author }}
      build_tools: true
      build_toolchain: true
      dummy_mode: true

  verify_fixture_cache_hit:
    name: Verify isolated GHCR cache hit and Toolchain selection
    needs: [determine_target, dummy_containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tools_required: ${{ steps.lookup.outputs.tools_required }}
      use_toolchain: ${{ steps.lookup.outputs.use_toolchain }}
      selected_container: ${{ steps.lookup.outputs.selected_container }}
      selected_image: ${{ steps.lookup.outputs.selected_image }}
    steps:
      - name: Check published fixture tags and resolve container selection
        id: lookup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR: ${{ needs.determine_target.outputs.author }}
          REPO_BRANCH: openwrt-25.12
          TARGET: ${{ needs.determine_target.outputs.target }}
          SUBTARGET: ${{ needs.determine_target.outputs.subtarget }}
          TOOLS_FINGERPRINT: ${{ needs.dummy_containers.outputs.tools_fingerprint }}
          TOOLCHAIN_FINGERPRINT: ${{ needs.dummy_containers.outputs.toolchain_fingerprint }}
          BUILD_TOOLCHAIN: "true"
        shell: bash
        run: |
          set -e
          OWNER_LC="${OWNER,,}"
          TOOLS_TAG="${AUTHOR}_${REPO_BRANCH}-${TOOLS_FINGERPRINT}-dummy-${GITHUB_RUN_ID}"
          TOOLCHAIN_TAG="${TARGET}-${SUBTARGET}-${AUTHOR}_${REPO_BRANCH}-${TOOLCHAIN_FINGERPRINT:0:32}-dummy-${GITHUB_RUN_ID}"
          GHCR_TOKEN="$(printf '%s' "$GITHUB_TOKEN" | base64 -w0)"
          GHCR_HEADER="Authorization: Bearer $GHCR_TOKEN"

          TOOLS_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -H "$GHCR_HEADER" -I "https://ghcr.io/v2/$OWNER_LC/tools/manifests/$TOOLS_TAG")"
          TOOLCHAIN_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -H "$GHCR_HEADER" -I "https://ghcr.io/v2/$OWNER_LC/toolchain/manifests/$TOOLCHAIN_TAG")"

          case "$TOOLS_STATUS" in
            200) TOOLS_REQUIRED=false ;;
            *) TOOLS_REQUIRED=true ;;
          esac
          case "$TOOLCHAIN_STATUS" in
            200) USE_TOOLCHAIN=true ;;
            *) USE_TOOLCHAIN=false ;;
          esac

          echo "Host Tools fixture lookup: HTTP $TOOLS_STATUS"
          echo "Toolchain fixture lookup: HTTP $TOOLCHAIN_STATUS"
          test "$TOOLS_REQUIRED" = false
          test "$USE_TOOLCHAIN" = true

          if [ "$BUILD_TOOLCHAIN" = true ] && [ "$USE_TOOLCHAIN" = true ]; then
            SELECTED_CONTAINER=toolchain
          else
            SELECTED_CONTAINER=tools
          fi
          SELECTED_IMAGE="ghcr.io/$OWNER_LC/$SELECTED_CONTAINER:$TOOLCHAIN_TAG"
          test "$SELECTED_CONTAINER" = toolchain
          test "$SELECTED_IMAGE" = "ghcr.io/$OWNER_LC/toolchain:$TOOLCHAIN_TAG"

          {
            echo "tools_required=$TOOLS_REQUIRED"
            echo "use_toolchain=$USE_TOOLCHAIN"
            echo "selected_container=$SELECTED_CONTAINER"
            echo "selected_image=$SELECTED_IMAGE"
          } >> "$GITHUB_OUTPUT"

  dummy_toolchain_image_consumer:
    name: Verify reusable_build starts the selected Toolchain fixture image
    needs: [determine_target, dummy_containers, verify_fixture_cache_hit]
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable_build.yml
    with:
      target: ${{ needs.determine_target.outputs.target }}
      subtarget: ${{ needs.determine_target.outputs.subtarget }}
      repo_url: ${{ needs.determine_target.outputs.repo_url }}
      repo_branch: openwrt-25.12
      repo_commit: ${{ needs.dummy_containers.outputs.source_commit }}
      tools_fingerprint: ${{ needs.dummy_containers.outputs.tools_fingerprint }}
      toolchain_fingerprint: ${{ needs.dummy_containers.outputs.toolchain_fingerprint }}
      author: ${{ needs.determine_target.outputs.author }}
      config_name: 360t7-immortalwrt-25.12-ubi.conf
      container_name: ${{ needs.verify_fixture_cache_hit.outputs.selected_container }}
      build_toolchain: true
      build_full: false
      build_kernel: false
      build_all_modules: false
      build_all_kmods: false
      build_dtb: false
      build_all_boards: false
      build_external_toolchain: false
      upload_external_toolchain: false
      use_ccache_cache: false
      check: false
      use_prebuilt_tools_artifact: false
      dummy_mode: true

  dummy_firmware_artifact:
    name: Create and upload non-flashable firmware fixture
    needs: [determine_target, dummy_containers]
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable_build.yml
    with:
      target: ${{ needs.determine_target.outputs.target }}
      subtarget: ${{ needs.determine_target.outputs.subtarget }}
      repo_url: ${{ needs.determine_target.outputs.repo_url }}
      repo_branch: ${{ needs.determine_target.outputs.repo_branch }}
      repo_commit: ${{ needs.dummy_containers.outputs.source_commit }}
      tools_fingerprint: ${{ needs.dummy_containers.outputs.tools_fingerprint }}
      toolchain_fingerprint: ${{ needs.dummy_containers.outputs.toolchain_fingerprint }}
      author: ${{ needs.determine_target.outputs.author }}
      config_name: 360t7-immortalwrt-25.12-ubi.conf
      container_name: tools
      build_toolchain: true
      build_full: true
      build_kernel: false
      build_all_modules: false
      build_all_kmods: false
      build_dtb: false
      build_all_boards: false
      build_external_toolchain: false
      upload_external_toolchain: false
      use_ccache_cache: false
      check: false
      use_prebuilt_tools_artifact: true
      dummy_mode: true

  dummy_external_toolchain_release:
    name: Verify fixed-release external Toolchain without building firmware
    needs: [dummy_containers]
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable_build.yml
    with:
      target: mediatek
      subtarget: filogic
      repo_url: immortalwrt/immortalwrt
      repo_branch: v25.12.2
      repo_commit: 4fc16f2985a358bd43bb522e43f05395fcbd6ed5
      tools_fingerprint: ${{ needs.dummy_containers.outputs.tools_fingerprint }}
      toolchain_fingerprint: ""
      author: immortalwrt
      config_name: ""
      container_name: tools
      build_toolchain: false
      build_full: false
      build_kernel: false
      build_all_modules: false
      build_all_kmods: false
      build_dtb: false
      build_all_boards: false
      build_external_toolchain: false
      upload_external_toolchain: false
      use_ccache_cache: false
      upload_ccache_cache: false
      check: false
      check_packages_list: ""
      use_prebuilt_tools_artifact: true
      dummy_mode: true
      test_expected_toolchain_type: external_toolchain

  dummy_external_sdk_release:
    name: Verify fixed-release external SDK without building firmware
    needs: [dummy_containers]
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable_build.yml
    with:
      target: mediatek
      subtarget: filogic
      repo_url: immortalwrt/immortalwrt
      repo_branch: v25.12.2
      repo_commit: 4fc16f2985a358bd43bb522e43f05395fcbd6ed5
      tools_fingerprint: ${{ needs.dummy_containers.outputs.tools_fingerprint }}
      toolchain_fingerprint: ""
      author: immortalwrt
      config_name: ""
      container_name: tools
      build_toolchain: false
      build_full: false
      build_kernel: false
      build_all_modules: false
      build_all_kmods: false
      build_dtb: false
      build_all_boards: false
      build_external_toolchain: false
      upload_external_toolchain: false
      use_ccache_cache: false
      upload_ccache_cache: false
      check: false
      check_packages_list: ""
      use_prebuilt_tools_artifact: true
      dummy_mode: true
      test_expected_toolchain_type: external_sdk
