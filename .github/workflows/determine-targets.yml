name: Get target info
on:
  workflow_call:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: true
        type: string
      config_name:
        description: 'Config file name'
        type: string
      source_commit:
        description: 'Optional exact source commit to resolve target configuration from'
        type: string
        default: ''
    outputs:
      target: 
        value: ${{ jobs.determine_targets.outputs.target}}
      subtarget:
        value: ${{ jobs.determine_targets.outputs.subtarget }}
      arch: 
        value: ${{ jobs.determine_targets.outputs.arch }}
      repo_url: 
        value: ${{ jobs.determine_targets.outputs.repo_url }}
      repo_branch:
        value: ${{ jobs.determine_targets.outputs.repo_branch }}
      author: 
        value: ${{ jobs.determine_targets.outputs.author }}
      source_commit:
        value: ${{ jobs.determine_targets.outputs.source_commit }}
jobs:
  determine_targets:
    name: Get target info
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.get_info.outputs.target }}
      subtarget: ${{ steps.get_info.outputs.subtarget }}
      arch: ${{ steps.get_info.outputs.arch }}
      repo_url: ${{ steps.get_repo_info.outputs.repo_url }}
      repo_branch: ${{ steps.get_repo_info.outputs.repo_branch }}
      author: ${{ steps.get_repo_info.outputs.author }}
      source_commit: ${{ steps.get_info.outputs.source_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Get repo info
        id: get_repo_info
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CONFIG_NAME: ${{ inputs.config_name }}
        shell: bash
        run: |
          set -euo pipefail

          case "$SOURCE_BRANCH" in
            openwrt/openwrt@main|coolsnowwolf/lede@master|immortalwrt/immortalwrt@openwrt-23.05|immortalwrt/immortalwrt@openwrt-24.10|immortalwrt/immortalwrt@openwrt-25.12) ;;
            *)
              echo "Unsupported source_branch: $SOURCE_BRANCH" >&2
              exit 1
              ;;
          esac

          if [[ -n "$SOURCE_COMMIT" && ! "$SOURCE_COMMIT" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "source_commit must be an exact 40-character Git commit SHA." >&2
            exit 1
          fi

          if [[ -n "$CONFIG_NAME" ]]; then
            case "$CONFIG_NAME" in
              .config7981|mt7981-ax3000.config|.config7981.mtwifi-cfg|360t7-immortalwrt.conf|360t7-immortalwrt-uhttpd.conf|360t7-immortalwrt-24.10.conf|360t7-immortalwrt-25.12-ubi.conf) ;;
              *)
                echo "Unsupported config_name: $CONFIG_NAME" >&2
                exit 1
                ;;
            esac
          fi

          REPO_URL="${SOURCE_BRANCH%@*}"
          REPO_BRANCH="${SOURCE_BRANCH#*@}"
          AUTHOR="${REPO_URL%%/*}"
          SOURCE_REF="$REPO_BRANCH"
          if [[ -n "$SOURCE_COMMIT" ]]; then
            SOURCE_REF="$SOURCE_COMMIT"
          fi

          {
            echo "repo_url=$REPO_URL"
            echo "repo_branch=$REPO_BRANCH"
            echo "author=$AUTHOR"
            echo "source_ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout openwrt source code
        if: inputs.config_name != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.get_repo_info.outputs.repo_url }}
          ref: ${{ steps.get_repo_info.outputs.source_ref }}
          path: openwrt

      - name: Get info
        id: get_info
        if: inputs.config_name != ''
        env:
          CONFIG_NAME: ${{ inputs.config_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d files ]]; then
            mv -f -- files openwrt/files
          fi
          test -f "$CONFIG_NAME"
          cp -f -- "$CONFIG_NAME" openwrt/.config
          cd openwrt
          make defconfig
          eval "$(grep \
                    -e ^CONFIG_TARGET_BOARD= \
                    -e ^CONFIG_TARGET_SUBTARGET= \
                    -e ^CONFIG_ARCH= \
                    .config 2>/dev/null \
            )"
          TARGET=${TARGET:-$CONFIG_TARGET_BOARD}
          SUBTARGET=${SUBTARGET:-$CONFIG_TARGET_SUBTARGET}
          ARCH=${ARCH:-$CONFIG_ARCH}
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          [[ -n ${SOURCE_COMMIT} ]] && echo "source_commit=$SOURCE_COMMIT" >> "${GITHUB_OUTPUT}"
          [[ -n ${TARGET} ]] && echo "target=$TARGET" >> ${GITHUB_OUTPUT}
          [[ -n ${SUBTARGET} ]] && echo "subtarget=$SUBTARGET" >> ${GITHUB_OUTPUT}
          [[ -n ${ARCH} ]] && echo "arch=$ARCH" >> ${GITHUB_OUTPUT}

      - name: Show configuration
        if: inputs.config_name != ''
        working-directory: openwrt
        run: cat .config
    