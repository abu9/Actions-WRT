name: Build Host Tools (one-time validation)
# Re-trigger to inspect the staged host Python interpreter.
run-name: Build Host Tools - ImmortalWrt 25.12 / 360T7

on:
  push:
    branches:
      - feat/360t7-openwrt-uboot-ubi-25.12
    paths:
      - .github/workflows/host-tools-build-once.yml

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build_host_tools:
    name: Build and publish generic Host Tools only
    uses: ./.github/workflows/push-containers.yml
    with:
      source_branch: immortalwrt/immortalwrt@openwrt-25.12
      config_name: 360t7-immortalwrt-25.12-ubi.conf
      source_commit: ''
      build_tools: true
      build_toolchain: false
