name: Build host tools

on:
  workflow_call:
    inputs:
      generate_prebuilt_artifacts:
        type: boolean
      repo_url:
        required: true
        type: string
      source_commit:
        description: 'Exact upstream source commit resolved by determine-targets/fingerprint'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build tools
    runs-on: ubuntu-24.04
    container: ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v28
    permissions:
      contents: read
      packages: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Checkout openwrt source code
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repo_url }}
          ref: ${{ inputs.source_commit }}
          path: openwrt

      - name: Verify checked out source commit
        working-directory: openwrt
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SOURCE_COMMIT" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Host Tools source commit mismatch: expected $EXPECTED_SOURCE_COMMIT, got $ACTUAL_SOURCE_COMMIT" >&2
            exit 1
          fi
          echo "Building Host Tools from exact source commit $ACTUAL_SOURCE_COMMIT"

      - name: Fix permission
        run: chown -R buildbot:buildbot .

      - name: Set configs for tools container
        shell: bash -c 'su --preserve-environment --command "sh -e" buildbot < "$1"' -- {0}
        working-directory: openwrt
        run: |
          touch .config
          echo CONFIG_DEVEL=y >> .config
          echo CONFIG_AUTOREMOVE=y >> .config
          echo CONFIG_CCACHE=y >> .config
          echo CONFIG_BUILD_ALL_HOST_TOOLS=y >> .config

      - name: Make prereq
        shell: bash -c 'su --preserve-environment --command "sh -e" buildbot < "$1"' -- {0}
        working-directory: openwrt
        run: make defconfig

      - name: Build tools
        shell: bash -c 'su --preserve-environment --command "sh -e" buildbot < "$1"' -- {0}
        working-directory: openwrt
        run: |
          make tools/install -j$(nproc) BUILD_LOG=1 || ret=$? ../.github/scripts/show_build_failures.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-buildbot-logs
          path: openwrt/logs

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-buildbot-config
          path: openwrt/.config

      - name: Archive prebuilt tools
        if: inputs.generate_prebuilt_artifacts == true
        shell: bash -c 'su --preserve-environment --command "sh -e" buildbot < "$1"' -- {0}
        working-directory: openwrt
        run: tar -cf tools.tar staging_dir/host build_dir/host

      - name: Upload prebuilt tools
        if: inputs.generate_prebuilt_artifacts == true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-buildbot-prebuilt-tools
          path: openwrt/tools.tar
