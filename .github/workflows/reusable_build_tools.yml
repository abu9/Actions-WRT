name: Build host tools

on:
  workflow_call:
    inputs:
      generate_prebuilt_artifacts:
        type: boolean
      repo_url:
        required: true
        type: string
      source_commit:
        description: 'Exact upstream source commit resolved by determine-targets/fingerprint'
        required: true
        type: string
      ccache_tag:
        description: 'Branch-scoped namespace for the persistent Host Tools ccache'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build tools
    runs-on: ubuntu-24.04
    container: ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v28
    permissions:
      contents: read
      packages: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Checkout openwrt source code
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repo_url }}
          ref: ${{ inputs.source_commit }}
          path: openwrt

      - name: Verify checked out source commit
        working-directory: openwrt
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SOURCE_COMMIT" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "Host Tools source commit mismatch: expected $EXPECTED_SOURCE_COMMIT, got $ACTUAL_SOURCE_COMMIT" >&2
            exit 1
          fi
          echo "Building Host Tools from exact source commit $ACTUAL_SOURCE_COMMIT"

      - name: Fix permission
        run: chown -R buildbot:buildbot .

      # U-Boot checks setuptools through STAGING_DIR_HOST/bin/python3, whose
      # sys.path includes Debian's /usr/lib/python3/dist-packages. Install the
      # Debian package and verify it with that exact interpreter below.
      - name: Install host Python setuptools dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-setuptools

      - name: Set configs for tools container
        working-directory: openwrt
        run: |
          su --preserve-environment --shell /bin/bash buildbot -c 'bash -s' <<'BUILD_SCRIPT'
          set -e
          touch .config
          echo CONFIG_DEVEL=y >> .config
          echo CONFIG_AUTOREMOVE=y >> .config
          echo CONFIG_CCACHE=y >> .config
          echo CONFIG_BUILD_ALL_HOST_TOOLS=y >> .config
          BUILD_SCRIPT

      - name: Make prereq
        working-directory: openwrt
        run: |
          su --preserve-environment --shell /bin/bash buildbot -c 'bash -s' <<'BUILD_SCRIPT'
          set -e
          make defconfig
          BUILD_SCRIPT

      - name: Verify host Python setuptools
        working-directory: openwrt
        run: |
          set -euo pipefail
          HOST_PYTHON="$PWD/staging_dir/host/bin/python3"
          if [ ! -x "$HOST_PYTHON" ]; then
            echo "Expected host Python executable not found: $HOST_PYTHON" >&2
            ls -la staging_dir/host/bin || true
            exit 1
          fi
          echo "Host Python resolves to: $(readlink -f "$HOST_PYTHON")"
          "$HOST_PYTHON" -c 'import setuptools; print("Host setuptools:", setuptools.__version__)'

      - name: Restore Host Tools ccache
        id: restore-ccache-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: openwrt/.ccache
          key: ccache-host-tools-${{ inputs.ccache_tag }}-buildworker-v28-${{ runner.os }}-${{ runner.arch }}

      - name: Configure Host Tools ccache
        working-directory: openwrt
        env:
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
        run: |
          su --preserve-environment --shell /bin/bash buildbot -c 'bash -s' <<'BUILD_SCRIPT'
          set -euo pipefail
          install -d staging_dir/host/etc .ccache
          touch staging_dir/host/etc/ccache.conf
          {
            echo compiler_type=gcc
            echo depend_mode=true
            echo sloppiness=file_macro,locale,time_macros
          } >> staging_dir/host/etc/ccache.conf
          chown -R buildbot:buildbot .ccache staging_dir/host/etc/ccache.conf
          BUILD_SCRIPT

      - name: Build tools
        working-directory: openwrt
        env:
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
        run: |
          su --preserve-environment --shell /bin/bash buildbot -c 'bash -s' <<'BUILD_SCRIPT'
          set -e
          make tools/install -j"$(nproc)" BUILD_LOG=1 || {
            ret=$?
            bash ../.github/scripts/show_build_failures.sh
            exit "$ret"
          }
          BUILD_SCRIPT

      - name: Show Host Tools ccache statistics
        if: always()
        working-directory: openwrt
        env:
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
        run: |
          su --preserve-environment --shell /bin/bash buildbot -c 'bash -s' <<'BUILD_SCRIPT'
          set -euo pipefail
          CCACHE_BIN="$PWD/staging_dir/host/bin/ccache"
          if [ -x "$CCACHE_BIN" ]; then
            "$CCACHE_BIN" --show-stats
          else
            echo "Host ccache executable not found; statistics unavailable."
          fi
          BUILD_SCRIPT

      - name: Delete existing Host Tools ccache entry
        if: steps.restore-ccache-cache.outputs.cache-hit == 'true'
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        with:
          route: DELETE /repos/{repository}/actions/caches?key={key}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_KEY: ${{ steps.restore-ccache-cache.outputs.cache-primary-key }}

      - name: Save Host Tools ccache
        if: success()
        uses: actions/cache/save@v6.1.0
        with:
          path: openwrt/.ccache
          key: ${{ steps.restore-ccache-cache.outputs.cache-primary-key }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-buildbot-logs
          path: openwrt/logs

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-buildbot-config
          path: openwrt/.config

      - name: Archive prebuilt tools
        if: inputs.generate_prebuilt_artifacts == true
        working-directory: openwrt
        run: |
          su --preserve-environment --shell /bin/bash buildbot -c 'bash -s' <<'BUILD_SCRIPT'
          set -e
          tar -cf tools.tar staging_dir/host build_dir/host
          BUILD_SCRIPT

      - name: Upload prebuilt tools
        if: inputs.generate_prebuilt_artifacts == true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-buildbot-prebuilt-tools
          path: openwrt/tools.tar
