name: Build host tools

on:
  workflow_call:
    inputs:
      generate_prebuilt_artifacts:
        type: boolean
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
    outputs:
      tools-hash: 
        value: ${{ jobs.build.outputs.tools-hash }}

permissions:
  contents: read

jobs:
  build:
    name: Build tools
    runs-on: ubuntu-latest
    container: ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v28
    outputs:
      tools-hash: ${{ steps.gen_tools_hash.outputs.tools-hash }}

    permissions:
      contents: read
      packages: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout openwrt source code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_url }}
          ref: ${{ inputs.repo_branch }}
          path: openwrt


      - name: Generate tools hash
        id: gen_tools_hash
        run: |
          TOOLS_HASH="${{ hashFiles('openwrt/include/**','openwrt/tools/**') }}"
          echo tools-hash=$TOOLS_HASH >> $GITHUB_OUTPUT

      - name: Fix permission
        run: chown -R buildbot:buildbot .

      - name: Set configs for tools container
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          touch .config
          echo CONFIG_DEVEL=y >> .config
          echo CONFIG_AUTOREMOVE=y >> .config
          echo CONFIG_CCACHE=y >> .config
          echo CONFIG_BUILD_ALL_HOST_TOOLS=y >> .config

      - name: Make prereq
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: make defconfig

      - name: Build tools
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: |
          make tools/install -j$(nproc) BUILD_LOG=1 || ret=$? ../.github/scripts/show_build_failures.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-buildbot-logs
          path: openwrt/logs

      - name: Upload config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-buildbot-config
          path: openwrt/.config

      - name: Archive prebuilt tools
        if: inputs.generate_prebuilt_artifacts == true
        shell: su buildbot -c "sh -e {0}"
        working-directory: openwrt
        run: tar -cf tools.tar staging_dir/host build_dir/host

      - name: Upload prebuilt tools
        if: inputs.generate_prebuilt_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: linux-buildbot-prebuilt-tools
          path: openwrt/tools.tar
