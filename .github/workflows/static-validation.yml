name: Static workflow validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: static-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows (no builds)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Create buildbot test account
        run: sudo useradd --no-create-home --shell /bin/bash buildbot

      - name: Validate buildbot execution environment
        shell: sudo -E -n -u buildbot -- bash -e {0}
        run: |
          test "$(id -un)" = buildbot
          test -n "$GITHUB_WORKSPACE"
          test "$SHELL_TEST_VALUE" = preserved
        env:
          SHELL_TEST_VALUE: preserved

      - name: Set up pinned Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25.0'
          cache: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint all workflow files
        run: |
          set -euo pipefail
          "$HOME/go/bin/actionlint" -shellcheck= -color .github/workflows/*.yml
          shellcheck --severity=error .github/scripts/*.sh
