name: Static workflow validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: static-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows (no builds)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify executable script modes
        run: |
          set -eo pipefail
          for script in diy-part1.sh diy-part2.sh; do
            mode="$(git ls-tree HEAD -- "$script" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "Expected $script to have Git mode 100755; got ${mode:-missing}." >&2
              exit 1
            fi
          done

      - name: Test custom script invocation in a clean shell
        shell: bash
        run: |
          set -euo pipefail

          workflow=".github/workflows/reusable_build.yml"
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          mkdir -p "$workspace/openwrt"

          extract_run() {
            awk -v wanted="$1" '
              $0 == "      - name: " wanted { found = 1; next }
              found && /^      - name: / { exit }
              found && /^        run: \\|$/ { in_run = 1; next }
              in_run && /^          / { sub(/^          /, ""); print; next }
              in_run && /^[[:space:]]*$/ { print ""; next }
              in_run { exit }
            ' "$workflow"
          }

          while IFS=: read -r step_name script_name; do
            script_path="$workspace/$script_name"
            marker="$workspace/$script_name.workspace"
            cat > "$script_path" <<'FIXTURE'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE was not resolved}"
          printf '%s\\n' "$GITHUB_WORKSPACE" > "$GITHUB_WORKSPACE/observed-workspace"
          FIXTURE

            run_script="$(extract_run "$step_name")"
            test -n "$run_script"

            (
              cd "$workspace/openwrt"
              env -i PATH="$PATH" bash --noprofile --norc -eo pipefail -c "$run_script"
            )

            test "$(cat "$workspace/observed-workspace")" = "$workspace"
            mv "$workspace/observed-workspace" "$marker"
          done <<'CASES'
          Load pre-custom script:diy-part1.sh
          Load post-custom script:diy-part2.sh
          CASES

      - name: Install pinned actionlint binary
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -eo pipefail

          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          install_dir="${RUNNER_TEMP}/actionlint"
          bin_dir="${RUNNER_TEMP}/bin"

          mkdir -p "$install_dir" "$bin_dir"
          curl --fail --location --silent --show-error "$url" --output "$install_dir/$archive"

          echo "${ACTIONLINT_SHA256}  $install_dir/$archive" | sha256sum --check --strict
          tar -xzf "$install_dir/$archive" -C "$install_dir" actionlint
          install -m 0755 "$install_dir/actionlint" "$bin_dir/actionlint"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Install ShellCheck
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Create ShellCheck error-only wrapper
        run: |
          set -eo pipefail
          cat > "$RUNNER_TEMP/shellcheck-errors-only" <<'WRAPPER'
          #!/usr/bin/env bash
          set -eo pipefail
          exec shellcheck --severity=error "$@"
          WRAPPER
          chmod 0755 "$RUNNER_TEMP/shellcheck-errors-only"

      - name: Lint all workflow files and embedded shell
        run: |
          set -eo pipefail
          actionlint -shellcheck="$RUNNER_TEMP/shellcheck-errors-only" -color .github/workflows/*.yml
          shellcheck --severity=error .github/scripts/*.sh
