name: Static workflow validation

on:
  push:
    branches:
      - feat/360t7-openwrt-uboot-ubi-25.12
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows (no builds)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint all workflow files
        run: |
          set -euo pipefail
          "$HOME/go/bin/actionlint" -color .github/workflows/*.yml
