name: Compute build fingerprints

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      source_commit:
        required: false
        type: string
        default: ''
      target:
        required: false
        type: string
        default: ''
      subtarget:
        required: false
        type: string
        default: ''
      tools_fingerprint:
        required: false
        type: string
        default: ''
      tools_image:
        required: false
        type: string
        default: ''
      use_ccache_cache:
        required: false
        type: boolean
        default: true
      use_prebuilt_tools_artifact:
        required: false
        type: boolean
        default: false
    outputs:
      tools_fingerprint:
        value: ${{ jobs.tools.outputs.tools_fingerprint }}
      toolchain_fingerprint:
        value: ${{ jobs.toolchain.outputs.toolchain_fingerprint }}
      toolchain_cache_key:
        value: ${{ jobs.toolchain.outputs.toolchain_cache_key }}
      source_commit:
        value: ${{ jobs.tools.outputs.source_commit || jobs.toolchain.outputs.source_commit }}

permissions:
  contents: read
  packages: read

jobs:
  tools:
    if: ${{ inputs.mode == 'tools' }}
    runs-on: ubuntu-24.04
    outputs:
      tools_fingerprint: ${{ steps.fp.outputs.tools_fingerprint }}
      source_commit: ${{ steps.fp.outputs.source_commit }}
    steps:
      - name: Checkout Actions-WRT scripts
        uses: actions/checkout@v7.0.1
        with:
          path: actions-wrt

      - name: Checkout OpenWrt source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repo_url }}
          ref: ${{ inputs.source_commit != '' && inputs.source_commit || inputs.repo_branch }}
          path: openwrt

      - name: Compute Host Tools fingerprint
        id: fp
        env:
          SOURCE_REPO: ${{ inputs.repo_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 actions-wrt/.github/scripts/fingerprint.py tools \
            --source-dir openwrt \
            --local-repo-dir actions-wrt \
            --source-repo "$SOURCE_REPO"

  toolchain:
    if: ${{ inputs.mode == 'toolchain' }}
    runs-on: ubuntu-24.04
    container: ${{ inputs.use_prebuilt_tools_artifact == true && 'ghcr.io/openwrt/buildbot/buildworker-v3.11.8:v23' || inputs.tools_image }}
    outputs:
      toolchain_fingerprint: ${{ steps.fp.outputs.toolchain_fingerprint }}
      toolchain_cache_key: ${{ steps.fp.outputs.toolchain_cache_key }}
      source_commit: ${{ steps.fp.outputs.source_commit }}
    steps:
      - name: Checkout Actions-WRT scripts
        uses: actions/checkout@v7.0.1
        with:
          path: actions-wrt

      - name: Checkout exact OpenWrt source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repo_url }}
          ref: ${{ inputs.source_commit }}
          path: openwrt

      - name: Fix checkout permissions
        run: chown -R buildbot:buildbot actions-wrt openwrt

      - name: Download prebuilt Host Tools artifact
        if: inputs.use_prebuilt_tools_artifact == true
        uses: actions/download-artifact@v8.0.2
        with:
          name: linux-buildbot-prebuilt-tools

      - name: Prepare prebuilt Host Tools directory
        if: inputs.use_prebuilt_tools_artifact == true
        run: install -d -o buildbot -g buildbot /prebuilt_tools

      - name: Extract prebuilt Host Tools artifact
        if: inputs.use_prebuilt_tools_artifact == true
        shell: su buildbot -c "sh -e {0}"
        run: tar -xf tools.tar -C /prebuilt_tools

      - name: Prepare prebuilt tools
        working-directory: openwrt
        shell: su buildbot -c "sh -e {0}"
        run: |
          mkdir -p staging_dir build_dir
          ln -s /prebuilt_tools/staging_dir/host staging_dir/host
          ln -s /prebuilt_tools/build_dir/host build_dir/host
          ./scripts/ext-tools.sh --refresh

      - name: Resolve the same internal Toolchain configuration as the build
        working-directory: openwrt
        env:
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
          USE_CCACHE_CACHE: ${{ inputs.use_ccache_cache }}
        shell: su buildbot -c "sh -e {0}"
        run: |
          rm -f .config
          if [ "$USE_CCACHE_CACHE" = "true" ]; then
            echo CONFIG_CCACHE=y >> .config
          fi
          echo CONFIG_DEVEL=y >> .config
          echo CONFIG_AUTOREMOVE=y >> .config
          echo "CONFIG_TARGET_${TARGET}=y" >> .config
          echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y" >> .config
          make defconfig
      - name: Prepare Toolchain fingerprint output handoff
        run: install -o buildbot -g buildbot -m 600 /dev/null "$RUNNER_TEMP/toolchain-fingerprint.outputs"

      - name: Compute Toolchain fingerprint
        env:
          SOURCE_REPO: ${{ inputs.repo_url }}
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
          TOOLS_FINGERPRINT: ${{ inputs.tools_fingerprint }}
          FINGERPRINT_OUTPUT_FILE: ${{ runner.temp }}/toolchain-fingerprint.outputs
        shell: su buildbot -c "sh -e {0}"
        run: |
          python3 actions-wrt/.github/scripts/fingerprint.py toolchain \
            --source-dir openwrt \
            --local-repo-dir actions-wrt \
            --source-repo "$SOURCE_REPO" \
            --target "$TARGET" \
            --subtarget "$SUBTARGET" \
            --tools-fingerprint "$TOOLS_FINGERPRINT" \
            --output-file "$FINGERPRINT_OUTPUT_FILE"

      - name: Validate and publish Toolchain fingerprint outputs
        id: fp
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          FINGERPRINT_OUTPUT_FILE: ${{ runner.temp }}/toolchain-fingerprint.outputs
        run: |
          python3 actions-wrt/.github/scripts/fingerprint.py publish-toolchain-outputs \
            --input-file "$FINGERPRINT_OUTPUT_FILE" \
            --expected-source-commit "$EXPECTED_SOURCE_COMMIT" \
            --github-output "$GITHUB_OUTPUT"