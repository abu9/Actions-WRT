name: Bootstrap Host Tools and Toolchain images
run-name: Bootstrap OpenWrt 25.12 Host Tools and Toolchain images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch_image_build:
    name: Dispatch fingerprinted image build
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Host Tools and Toolchain build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/push-containers.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f 'inputs[source_branch]=immortalwrt/immortalwrt@openwrt-25.12' \
            -f 'inputs[config_name]=360t7-immortalwrt-25.12-ubi.conf' \
            -f 'inputs[build_tools]=true' \
            -f 'inputs[build_toolchain]=true'
          echo "Dispatched push-containers.yml for ${GITHUB_SHA}"
