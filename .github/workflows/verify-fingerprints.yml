name: Build-free fingerprint verification

on:
  push:
    branches:
      - feat/360t7-openwrt-uboot-ubi-25.12
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/dockerfiles/**'
      - '360t7-immortalwrt-25.12-ubi.conf'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate workflow and fingerprint implementation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.load_file(f, aliases: true); puts "YAML OK: #{f}" }'

      - name: Validate Python fingerprint implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/fingerprint.py
          python3 -m unittest discover \
            -s .github/scripts/tests \
            -p 'test_fingerprint.py' \
            -v

      - name: Validate workflow references and local ownership
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/scripts/tools-fingerprint.py
          test ! -e .github/scripts/toolchain-fingerprint.py
          test ! -e .github/scripts/ghcr-check-fingerprint.sh
          test ! -e .github/workflows/reusable_tools_fingerprint.yml
          test ! -e .github/workflows/reusable_toolchain_fingerprint.yml
          if grep -RInE 'actions-shared-workflows|abu9/actions-shared-workflows' .github --exclude='verify-fingerprints.yml'; then
            echo "Unexpected shared-workflows runtime reference found." >&2
            exit 1
          fi
          test -f .github/scripts/fingerprint.py
          test -f .github/scripts/tests/test_fingerprint.py
          test -f .github/workflows/fingerprint.yml

  determine_targets:
    name: Resolve OpenWrt source and target
    needs: validate
    uses: ./.github/workflows/determine-targets.yml
    with:
      source_branch: immortalwrt/immortalwrt@openwrt-25.12
      config_name: 360t7-immortalwrt-25.12-ubi.conf

  tools_fingerprint:
    name: Calculate current Host Tools fingerprint
    needs: [validate, determine_targets]
    uses: ./.github/workflows/fingerprint.yml
    with:
      mode: tools
      repo_url: ${{ needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ needs.determine_targets.outputs.repo_branch }}
      source_commit: ${{ needs.determine_targets.outputs.source_commit }}

  check_tools_image:
    name: Check current Host Tools image in GHCR
    needs: [determine_targets, tools_fingerprint]
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      image: ${{ steps.check.outputs.image }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify existing Host Tools image labels
        id: check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR: ${{ needs.determine_targets.outputs.author }}
          REPO_BRANCH: ${{ needs.determine_targets.outputs.repo_branch }}
          FINGERPRINT: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
          SOURCE_COMMIT: ${{ needs.tools_fingerprint.outputs.source_commit }}
          SOURCE_REPOSITORY: ${{ needs.determine_targets.outputs.repo_url }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="${OWNER,,}"
          TAG="${AUTHOR}_${REPO_BRANCH}-${FINGERPRINT}"
          IMAGE="ghcr.io/${OWNER_LC}/tools:${TAG}"
          set +e
          python3 .github/scripts/fingerprint.py ghcr-check \
            --owner "$OWNER" \
            --image tools \
            --tag "$TAG" \
            --label "io.abu9.actions-wrt.tools-fingerprint=$FINGERPRINT" \
            --label "io.abu9.actions-wrt.tools-source-commit=$SOURCE_COMMIT" \
            --label "io.abu9.actions-wrt.tools-source-repository=$SOURCE_REPOSITORY"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Host Tools image exists and all expected labels match: $IMAGE"
          elif [ "$rc" -eq 1 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Host Tools image is missing or its labels do not match: $IMAGE"
          else
            exit "$rc"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  toolchain_fingerprint:
    name: Calculate current target Toolchain fingerprint
    needs: [determine_targets, tools_fingerprint, check_tools_image]
    if: ${{ needs.check_tools_image.outputs.exists == 'true' }}
    uses: ./.github/workflows/fingerprint.yml
    with:
      mode: toolchain
      repo_url: ${{ needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ needs.determine_targets.outputs.repo_branch }}
      source_commit: ${{ needs.tools_fingerprint.outputs.source_commit }}
      target: ${{ needs.determine_targets.outputs.target }}
      subtarget: ${{ needs.determine_targets.outputs.subtarget }}
      tools_fingerprint: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
      tools_image: ${{ needs.check_tools_image.outputs.image }}
      use_ccache_cache: true

  check_toolchain_image:
    name: Check current Toolchain image in GHCR
    needs: [determine_targets, tools_fingerprint, toolchain_fingerprint]
    if: ${{ needs.toolchain_fingerprint.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify existing Toolchain image labels
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ needs.determine_targets.outputs.target }}
          SUBTARGET: ${{ needs.determine_targets.outputs.subtarget }}
          AUTHOR: ${{ needs.determine_targets.outputs.author }}
          REPO_BRANCH: ${{ needs.determine_targets.outputs.repo_branch }}
          TOOLCHAIN_FINGERPRINT: ${{ needs.toolchain_fingerprint.outputs.toolchain_fingerprint }}
          TOOLS_FINGERPRINT: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${TARGET}-${SUBTARGET}-${AUTHOR}_${REPO_BRANCH}-${TOOLCHAIN_FINGERPRINT:0:32}"
          set +e
          python3 .github/scripts/fingerprint.py ghcr-check \
            --owner "$OWNER" \
            --image toolchain \
            --tag "$TAG" \
            --label "io.abu9.actions-wrt.toolchain-fingerprint=$TOOLCHAIN_FINGERPRINT" \
            --label "io.abu9.actions-wrt.tools-fingerprint=$TOOLS_FINGERPRINT"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Toolchain image exists and all expected labels match: ghcr.io/${OWNER,,}/toolchain:$TAG"
          elif [ "$rc" -eq 1 ]; then
            echo "Toolchain image is missing or its labels do not match: ghcr.io/${OWNER,,}/toolchain:$TAG"
            echo "A Toolchain build/publish is required before it can be reused."
          else
            exit "$rc"
          fi

  summary:
    name: Fingerprint verification summary
    needs: [determine_targets, tools_fingerprint, check_tools_image, toolchain_fingerprint, check_toolchain_image]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Write verification summary
        env:
          TARGET_RESULT: ${{ needs.determine_targets.result }}
          TOOLS_FP_RESULT: ${{ needs.tools_fingerprint.result }}
          TOOLS_EXISTS: ${{ needs.check_tools_image.outputs.exists }}
          TOOLCHAIN_FP_RESULT: ${{ needs.toolchain_fingerprint.result }}
          TOOLCHAIN_CHECK_RESULT: ${{ needs.check_toolchain_image.result }}
        shell: bash
        run: |
          {
            echo "## Build-free fingerprint verification"
            echo ""
            echo "- OpenWrt target resolution: $TARGET_RESULT"
            echo "- Host Tools fingerprint calculation: $TOOLS_FP_RESULT"
            if [ "$TOOLS_EXISTS" = "true" ]; then
              echo "- Host Tools GHCR image: present; expected labels match"
            elif [ "$TOOLS_EXISTS" = "false" ]; then
              echo "- Host Tools GHCR image: missing or labels mismatch"
            else
              echo "- Host Tools GHCR image: not checked"
            fi
            echo "- Toolchain fingerprint calculation: $TOOLCHAIN_FP_RESULT"
            echo "- Toolchain GHCR verification: $TOOLCHAIN_CHECK_RESULT"
            echo ""
            echo "- This workflow does not build or publish images or firmware."
          } >> "$GITHUB_STEP_SUMMARY"
