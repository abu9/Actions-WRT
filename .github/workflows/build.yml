name: Build WRT
run-name: Build WRT - ${{ github.event.client_payload.source_branch || inputs.source_branch || 'immortalwrt/immortalwrt@openwrt-25.12' }}/${{ github.event.client_payload.config_name || inputs.config_name || '360t7-immortalwrt-25.12-ubi.conf' }}${{ (github.event_name == 'pull_request' || inputs.validate_only) && ' [validation only]' || '' }}

on:
  pull_request:
    branches:
      - main
  repository_dispatch:
    types:
      - Source Code Update
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        type: choice
        options:
          - openwrt/openwrt@main
          - coolsnowwolf/lede@master
          - immortalwrt/immortalwrt@openwrt-23.05
          - immortalwrt/immortalwrt@openwrt-24.10
          - immortalwrt/immortalwrt@openwrt-25.12
          - immortalwrt/immortalwrt@v25.12.2
        default: 'immortalwrt/immortalwrt@openwrt-25.12'
      source_commit:
        description: 'Optional exact upstream source commit; empty resolves the selected branch once'
        required: false
        default: ''
        type: string
      validate_only:
        description: 'Validate source, target, fingerprint and GHCR cache selection without building tools or firmware'
        type: boolean
        default: false
      config_name:
        description: 'Config file name'
        type: choice
        options:
          - '.config7981'
          - '.config7981.mtwifi-cfg'
          - '360t7-immortalwrt.conf'
          - '360t7-immortalwrt-uhttpd.conf'
          - '360t7-immortalwrt-24.10.conf'
          - '360t7-immortalwrt-25.12-ubi.conf'
        default: '360t7-immortalwrt-25.12-ubi.conf'
      build_toolchain:
        description: 'Check for and reuse a fingerprint-matched target Toolchain image; build the target Toolchain from source if unavailable. When disabled, use the normal official-release or internal-toolchain path.'
        type: boolean
        default: false
      debug:
        type: boolean
      build_kernel:
        type: boolean
      use_ccache_cache:
        type: boolean
        default: true
      build_full:
        type: boolean
        default: true

concurrency:
  group: build-wrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine_targets:
    name: Get target info
    uses: ./.github/workflows/determine-targets.yml
    with:
      config_name: ${{ github.event.client_payload.config_name || inputs.config_name || '360t7-immortalwrt-25.12-ubi.conf' }}
      source_branch: ${{ github.event.client_payload.source_branch || inputs.source_branch || 'immortalwrt/immortalwrt@openwrt-25.12' }}
      source_commit: ${{ github.event.client_payload.source_commit || inputs.source_commit || '' }}

  test_fingerprints:
    name: Run build-free fingerprint regression tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Actions-WRT
        uses: actions/checkout@v7.0.1
      - name: Run fingerprint tests
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_fingerprint.py' -v

  tools_fingerprint:
    name: Calculate generic host-tools fingerprint
    needs: [determine_targets, test_fingerprints]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/fingerprint.yml
    with:
      mode: tools
      repo_url: ${{ needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ needs.determine_targets.outputs.repo_branch }}
      source_commit: ${{ needs.determine_targets.outputs.source_commit }}

  check_tools_container:
    name: Check Host Tools image
    needs: [determine_targets, tools_fingerprint]
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: read}
    outputs:
      tools_required: ${{ steps.check.outputs.tools_required }}
      checked_image: ${{ steps.check.outputs.checked_image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR: ${{ needs.determine_targets.outputs.author }}
          REPO_BRANCH: ${{ needs.determine_targets.outputs.repo_branch }}
          EXPECTED_FINGERPRINT: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
          SOURCE_REPOSITORY: ${{ needs.determine_targets.outputs.repo_url }}
        run: |
          set +e
          TAG="$AUTHOR"_"$REPO_BRANCH-$EXPECTED_FINGERPRINT"
          python3 .github/scripts/fingerprint.py ghcr-check --owner "$OWNER" --image tools --tag "$TAG"             --label "io.abu9.actions-wrt.tools-fingerprint=$EXPECTED_FINGERPRINT"             --label "io.abu9.actions-wrt.tools-source-repository=$SOURCE_REPOSITORY"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "tools_required=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "tools_required=true" >> "$GITHUB_OUTPUT"
          else
            exit "$rc"
          fi
          echo "checked_image=tools:$TAG" >> "$GITHUB_OUTPUT"

  build_tools_container:
    name: Build and Push tools container (only when missing)
    needs: [determine_targets, tools_fingerprint, check_tools_container]
    if: ${{ github.event_name != 'pull_request' && inputs.validate_only != true && needs.check_tools_container.outputs.tools_required == 'true' }}
    permissions: {contents: read, packages: write, actions: write}
    uses: ./.github/workflows/push-containers.yml
    with:
      source_branch: ${{ github.event.client_payload.source_branch || inputs.source_branch || 'immortalwrt/immortalwrt@openwrt-25.12' }}
      config_name: ${{ github.event.client_payload.config_name || inputs.config_name || '360t7-immortalwrt-25.12-ubi.conf' }}
      source_commit: ${{ needs.tools_fingerprint.outputs.source_commit }}
      build_tools: true
      build_toolchain: false

  tools_ready:
    name: Verify Host Tools image is ready
    needs: [determine_targets, tools_fingerprint, check_tools_container, build_tools_container]
    if: ${{ !cancelled() && needs.check_tools_container.result == 'success' && (needs.build_tools_container.result == 'success' || needs.build_tools_container.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      checked_image: ${{ needs.check_tools_container.outputs.checked_image }}
      tools_image: ${{ steps.image.outputs.tools_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
          CHECKED_IMAGE: ${{ needs.check_tools_container.outputs.checked_image }}
        run: |
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="$(printf '%s' "$CHECKED_IMAGE" | cut -d: -f2-)"
          echo "tools_image=ghcr.io/$OWNER_LC/tools:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Verify selected image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXPECTED_FINGERPRINT: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
          SOURCE_REPOSITORY: ${{ needs.determine_targets.outputs.repo_url }}
          CHECKED_IMAGE: ${{ needs.check_tools_container.outputs.checked_image }}
          TOOLS_REQUIRED: ${{ needs.check_tools_container.outputs.tools_required }}
          BUILD_RESULT: ${{ needs.build_tools_container.result }}
        run: |
          set -euo pipefail
          if [ "$TOOLS_REQUIRED" = "true" ]; then test "$BUILD_RESULT" = success; fi
          TAG="$(printf '%s' "$CHECKED_IMAGE" | cut -d: -f2-)"
          python3 .github/scripts/fingerprint.py ghcr-check --owner "$OWNER" --image tools --tag "$TAG"             --label "io.abu9.actions-wrt.tools-fingerprint=$EXPECTED_FINGERPRINT"             --label "io.abu9.actions-wrt.tools-source-repository=$SOURCE_REPOSITORY"

  toolchain_fingerprint:
    name: Calculate target Toolchain fingerprint
    if: ${{ inputs.build_toolchain == true }}
    needs: [determine_targets, tools_fingerprint, tools_ready]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/fingerprint.yml
    with:
      mode: toolchain
      repo_url: ${{ needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ needs.determine_targets.outputs.repo_branch }}
      source_commit: ${{ needs.tools_fingerprint.outputs.source_commit }}
      target: ${{ needs.determine_targets.outputs.target }}
      subtarget: ${{ needs.determine_targets.outputs.subtarget }}
      tools_fingerprint: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
      tools_image: ${{ needs.tools_ready.outputs.tools_image }}
      use_ccache_cache: ${{ github.event_name == 'repository_dispatch' || inputs.use_ccache_cache == true }}

  check_toolchain_container:
    name: Check target Toolchain image
    needs: [determine_targets, tools_fingerprint, tools_ready, toolchain_fingerprint]
    if: ${{ inputs.build_toolchain == true }}
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: read}
    outputs:
      use_toolchain: ${{ steps.check.outputs.use_toolchain }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ needs.determine_targets.outputs.target }}
          SUBTARGET: ${{ needs.determine_targets.outputs.subtarget }}
          AUTHOR: ${{ needs.determine_targets.outputs.author }}
          REPO_BRANCH: ${{ needs.determine_targets.outputs.repo_branch }}
          FINGERPRINT: ${{ needs.toolchain_fingerprint.outputs.toolchain_fingerprint }}
          TOOLS_FINGERPRINT: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$TARGET-$SUBTARGET-$AUTHOR"_"$REPO_BRANCH-${FINGERPRINT:0:32}"
          set +e
          python3 .github/scripts/fingerprint.py ghcr-check \
            --owner "$OWNER" \
            --image toolchain \
            --tag "$TAG" \
            --label "io.abu9.actions-wrt.toolchain-fingerprint=$FINGERPRINT" \
            --label "io.abu9.actions-wrt.tools-fingerprint=$TOOLS_FINGERPRINT"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "use_toolchain=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "use_toolchain=false" >> "$GITHUB_OUTPUT"
          else
            exit "$rc"
          fi
          echo "image=toolchain:$TAG" >> "$GITHUB_OUTPUT"

  build_firmware:
    name: Build firmware
    needs: [determine_targets, tools_fingerprint, tools_ready, toolchain_fingerprint, check_toolchain_container]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && inputs.validate_only != true && needs.determine_targets.result == 'success' && needs.tools_ready.result == 'success' && (needs.toolchain_fingerprint.result == 'success' || needs.toolchain_fingerprint.result == 'skipped') && (needs.check_toolchain_container.result == 'success' || needs.check_toolchain_container.result == 'skipped') }}
    permissions: {contents: read, packages: read, actions: write}
    uses: ./.github/workflows/reusable_build.yml
    with:
      target: ${{ needs.determine_targets.outputs.target }}
      subtarget: ${{ needs.determine_targets.outputs.subtarget }}
      repo_url: ${{ needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ needs.determine_targets.outputs.repo_branch }}
      repo_commit: ${{ needs.tools_fingerprint.outputs.source_commit }}
      tools_fingerprint: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
      toolchain_fingerprint: ${{ needs.toolchain_fingerprint.outputs.toolchain_fingerprint }}
      author: ${{ needs.determine_targets.outputs.author }}
      container_name: ${{ (inputs.build_toolchain == true && needs.check_toolchain_container.outputs.use_toolchain == 'true') && 'toolchain' || 'tools' }}
      build_kernel: ${{ inputs.build_kernel == true }}
      build_full: ${{ github.event_name == 'repository_dispatch' || inputs.build_full == true }}
      build_toolchain: ${{ inputs.build_toolchain == true && needs.check_toolchain_container.outputs.use_toolchain != 'true' }}
      debug: ${{ inputs.debug == true }}
      config_name: ${{ github.event.client_payload.config_name || inputs.config_name || '360t7-immortalwrt-25.12-ubi.conf' }}
      ccache_type: packages
      use_ccache_cache: ${{ github.event_name == 'repository_dispatch' || inputs.use_ccache_cache == true }}
      check: true
