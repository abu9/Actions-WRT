name: Build WRT
run-name: Build WRT - ${{ inputs.source_branch }}/${{ inputs.config_name }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        type: choice
        options:
          - openwrt/openwrt@main
          - coolsnowwolf/lede@master
          - immortalwrt/immortalwrt@openwrt-23.05
          - immortalwrt/immortalwrt@openwrt-24.10
          - immortalwrt/immortalwrt@openwrt-25.12
          - hanwckf/immortalwrt-mt798x@openwrt-21.02
        default: 'immortalwrt/immortalwrt@openwrt-25.12'
      config_name:
        description: 'Config file name'
        type: choice
        options:
          - '.config7981'
          - 'mt7981-ax3000.config'
          - '.config7981.mtwifi-cfg'
          - '360t7-immortalwrt.conf'
          - '360t7-immortalwrt-uhttpd.conf'
          - '360t7-immortalwrt-24.10.conf'
          - '360t7-immortalwrt-25.12-ubi.conf'
        default: '360t7-immortalwrt-25.12-ubi.conf'
      build_toolchain:
        description: 'Build the target toolchain from source; disable to use the official prebuilt toolchain/SDK when available'
        type: boolean
        default: false
      debug:
        type: boolean
      build_kernel:
        type: boolean
      use_ccache_cache:
        type: boolean
        default: true
      build_full:
        type: boolean
        default: true
      container_name:
        type: choice
        default: 'tools'
        options:
          - 'tools'
          - 'toolchain'

env:
  REPO_URL: hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF:
  CONFIG_FILE: ${{ github.event.inputs.config_name || '360t7-immortalwrt-25.12-ubi.conf' }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  determine_targets:
    name: Get target info
    uses: ./.github/workflows/determine-targets.yml
    with:
      config_name: ${{ inputs.config_name }}
      source_branch: ${{ inputs.source_branch }}

  tools_fingerprint:
    name: Calculate generic host-tools fingerprint
    needs: determine_targets
    uses: ./.github/workflows/reusable_tools_fingerprint.yml
    with:
      repo_url: ${{ needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ needs.determine_targets.outputs.repo_branch }}

  check_tools_container:
    name: Check whether a tools container is needed
    needs: [determine_targets, tools_fingerprint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tools_required: ${{ steps.check.outputs.tools_required }}
      checked_image: ${{ steps.check.outputs.checked_image }}
      expected_fingerprint: ${{ steps.check.outputs.expected_fingerprint }}
    steps:
      - name: Check GHCR manifest and tools fingerprint
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR: ${{ needs.determine_targets.outputs.author }}
          REPO_BRANCH: ${{ needs.determine_targets.outputs.repo_branch }}
          TARGET: ${{ needs.determine_targets.outputs.target }}
          SUBTARGET: ${{ needs.determine_targets.outputs.subtarget }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          EXPECTED_FINGERPRINT: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="${OWNER,,}"
          BASE_TAG="${AUTHOR}_${REPO_BRANCH}"
          TOOLS_TAG="${BASE_TAG}-${EXPECTED_FINGERPRINT}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          if [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "Expected tools fingerprint is empty; refusing to reuse any image." >&2
            exit 1
          fi
          echo "expected_fingerprint=$EXPECTED_FINGERPRINT" >> "$GITHUB_OUTPUT"

          registry_token() {
            local image="$1"
            local token
            token="$(curl --fail --silent --show-error --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
              "https://ghcr.io/token?scope=repository:${OWNER_LC}/${image}:pull" | jq -r '.token // .access_token // empty')"
            if [ -z "$token" ]; then
              echo "Unable to obtain a GHCR pull token for ${image}." >&2
              exit 1
            fi
            printf '%s' "$token"
          }

          check_manifest_exists() {
            local image="$1"
            local tag="$2"
            local token status
            token="$(registry_token "$image")"
            status="$(curl --silent --show-error --output "$TMP_DIR/manifest.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${OWNER_LC}/${image}/manifests/${tag}")"
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "GHCR manifest check failed for ${image}:${tag} (HTTP $status)." >&2; exit 1 ;;
            esac
          }

          check_tools_fingerprint() {
            local image="$1"
            local tag="$2"
            local token status manifest_digest config_digest image_fingerprint
            token="$(registry_token "$image")"
            status="$(curl --silent --show-error --output "$TMP_DIR/manifest.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${OWNER_LC}/${image}/manifests/${tag}")"
            case "$status" in
              200) ;;
              404) return 1 ;;
              *) echo "GHCR manifest check failed for ${image}:${tag} (HTTP $status)." >&2; exit 1 ;;
            esac

            # docker/build-push-action may publish an OCI index with provenance.
            # Read the linux/amd64 image manifest, not an attestation descriptor.
            if jq -e '.manifests | type == "array"' "$TMP_DIR/manifest.json" >/dev/null; then
              manifest_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty' "$TMP_DIR/manifest.json")"
              if [ -z "$manifest_digest" ]; then
                echo "No linux/amd64 image manifest found in ${image}:${tag}; image must be rebuilt."
                return 1
              fi
              status="$(curl --silent --show-error --output "$TMP_DIR/platform-manifest.json" --write-out '%{http_code}' \
                --header "Authorization: Bearer $token" \
                --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${OWNER_LC}/${image}/manifests/${manifest_digest}")"
              case "$status" in
                200) mv "$TMP_DIR/platform-manifest.json" "$TMP_DIR/manifest.json" ;;
                404) return 1 ;;
                *) echo "GHCR platform manifest read failed for ${image}:${tag} (HTTP $status)." >&2; exit 1 ;;
              esac
            fi

            config_digest="$(jq -r '.config.digest // empty' "$TMP_DIR/manifest.json")"
            if [ -z "$config_digest" ]; then
              echo "Image config digest missing in ${image}:${tag}; image must be rebuilt."
              return 1
            fi
            status="$(curl --silent --show-error --output "$TMP_DIR/config.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              "https://ghcr.io/v2/${OWNER_LC}/${image}/blobs/${config_digest}")"
            case "$status" in
              200) ;;
              404) return 1 ;;
              *) echo "GHCR image config read failed for ${image}:${tag} (HTTP $status)." >&2; exit 1 ;;
            esac

            image_fingerprint="$(jq -r '.config.Labels["io.abu9.actions-wrt.tools-fingerprint"] // empty' "$TMP_DIR/config.json")"
            if [ "$image_fingerprint" = "$EXPECTED_FINGERPRINT" ]; then
              return 0
            fi
            echo "Stale or unlabelled tools image: ${image}:${tag}"
            echo "  image fingerprint: ${image_fingerprint:-<missing>}"
            echo "  expected fingerprint: $EXPECTED_FINGERPRINT"
            return 1
          }

          # A target-specific toolchain image remains a separate cache type.
          # Its fingerprint is deliberately not conflated with generic host tools.
          if [ "$CONTAINER_NAME" = "toolchain" ]; then
            TOOLCHAIN_TAG="${TARGET}-${SUBTARGET}-${BASE_TAG}-${EXPECTED_FINGERPRINT}"
            if check_tools_fingerprint toolchain "$TOOLCHAIN_TAG"; then
              echo "Existing target toolchain image found: ghcr.io/${OWNER_LC}/toolchain:${TOOLCHAIN_TAG}"
              echo "tools_required=false" >> "$GITHUB_OUTPUT"
              echo "checked_image=toolchain:${TOOLCHAIN_TAG}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if check_tools_fingerprint tools "$TOOLS_TAG"; then
            echo "Matching fingerprinted tools image found: ghcr.io/${OWNER_LC}/tools:${TOOLS_TAG}"
            echo "tools_required=false" >> "$GITHUB_OUTPUT"
            echo "checked_image=tools:${TOOLS_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "Fingerprint-specific tools image is missing or stale: ghcr.io/${OWNER_LC}/tools:${TOOLS_TAG}"
            echo "tools_required=true" >> "$GITHUB_OUTPUT"
            echo "checked_image=tools:${TOOLS_TAG}" >> "$GITHUB_OUTPUT"
          fi

  build_tools_container:
    name: Build and Push tools container (only when missing)
    needs: [determine_targets, tools_fingerprint, check_tools_container]
    if: >-
      ${{ needs.tools_fingerprint.result == 'success' &&
          needs.check_tools_container.outputs.tools_required == 'true' }}
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/push-containers.yml
    with:
      source_branch: ${{ inputs.source_branch }}
      config_name: ${{ inputs.config_name }}
      source_commit: ${{ needs.tools_fingerprint.outputs.source_commit }}
      build_tools: true
      build_toolchain: false

  build_firmware:
    name: Build firmware
    needs: [determine_targets, tools_fingerprint, check_tools_container, build_tools_container]
    if: >-
      ${{ always() &&
          needs.determine_targets.result == 'success' &&
          needs.tools_fingerprint.result == 'success' &&
          needs.check_tools_container.result == 'success' &&
          (needs.build_tools_container.result == 'success' ||
           needs.build_tools_container.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/reusable_build.yml
    with:
      target: ${{ needs.determine_targets.outputs.target }}
      subtarget: ${{ needs.determine_targets.outputs.subtarget }}
      repo_url: ${{ needs.determine_targets.outputs.repo_url }}
      repo_branch: ${{ needs.determine_targets.outputs.repo_branch }}
      repo_commit: ${{ needs.tools_fingerprint.outputs.source_commit }}
      tools_fingerprint: ${{ needs.tools_fingerprint.outputs.tools_fingerprint }}
      author: ${{ needs.determine_targets.outputs.author }}
      # Only request the target-toolchain image when the preceding GHCR label check verified its fingerprint.
      container_name: ${{ startsWith(needs.check_tools_container.outputs.checked_image, 'toolchain:') && 'toolchain' || 'tools' }}
      build_kernel: ${{ inputs.build_kernel }}
      build_full: ${{ inputs.build_full }}
      build_toolchain: ${{ inputs.build_toolchain }}
      debug: ${{ inputs.debug }}
      config_name: ${{ inputs.config_name }}
      ccache_type: packages
      use_ccache_cache: ${{ inputs.use_ccache_cache }}
